version: "3.9"

services:
  postgres:
    image: timescale/timescaledb:2.15.3-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinelot
      POSTGRES_USER: sentinelot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    ports:
      - "6379:6379"

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    restart: unless-stopped
    command: ["start-dev"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
    ports:
      - "8080:8080"

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  ingestion-api:
    build:
      context: ./services/ingestion-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sentinelot:${POSTGRES_PASSWORD}@postgres:5432/sentinelot
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KEYCLOAK_ISSUER_URL: http://keycloak:8080/realms/sentinelot
    ports:
      - "8000:8000"

  stream-processor:
    build:
      context: ./services/stream-processor
    restart: unless-stopped
    depends_on:
      - redpanda
      - postgres
    environment:
      DATABASE_URL: postgresql://sentinelot:${POSTGRES_PASSWORD}@postgres:5432/sentinelot
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092

volumes:
  pgdata:
  miniodata:

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SentinelOT — Pune Pilot Plant</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #0f1115; color: #e6e6e6; margin: 0; padding: 24px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .subtitle { color: #8a8f98; font-size: 13px; margin-bottom: 24px; }
  .panel { background: #171a21; border: 1px solid #262b36; border-radius: 8px; padding: 16px; margin-bottom: 20px; }
  .panel h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; color: #8a8f98; margin: 0 0 12px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: #8a8f98; font-weight: 500; padding: 8px; border-bottom: 1px solid #262b36; }
  td { padding: 8px; border-bottom: 1px solid #1e222b; }
  .severity { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
  .severity-critical { background: #4a1620; color: #ff6b81; }
  .severity-high { background: #4a2e16; color: #ffab5e; }
  .severity-medium { background: #4a4116; color: #ffd85e; }
  .severity-low { background: #16304a; color: #5ea8ff; }
  .empty { color: #5a5f68; font-style: italic; padding: 12px 0; }
  .refresh-note { color: #5a5f68; font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
  <h1>SentinelOT</h1>
  <div class="subtitle" id="subtitle">Loading...</div>

  <div class="panel">
    <h2>Recent Alerts</h2>
    <table id="alerts-table">
      <thead><tr><th>Time</th><th>Severity</th><th>Description</th><th>Explanation</th><th>Status</th></tr></thead>
      <tbody id="alerts-body"></tbody>
    </table>
    <div id="alerts-empty" class="empty" style="display:none;">No alerts yet.</div>
  </div>

  <div class="panel">
    <h2>Asset Inventory</h2>
    <table id="assets-table">
      <thead><tr><th>IP Address</th><th>Role</th><th>Criticality</th><th>First Seen</th><th>Last Seen</th></tr></thead>
      <tbody id="assets-body"></tbody>
    </table>
    <div id="assets-empty" class="empty" style="display:none;">No devices discovered yet.</div>
  </div>

  <div class="refresh-note">Auto-refreshes every 5 seconds. &nbsp;|&nbsp; <a href="../reports/compliance_report.html" style="color:#5ea8ff;" target="_blank">View Compliance Report</a></div>

<script>
// Edit these two constants if your API or site changes.
const API_BASE = "http://localhost:8000";
const SITE_ID = "22222222-2222-2222-2222-222222222222";
const KEYCLOAK_URL = "http://localhost:8080";
// Dev-only hardcoded credentials for this lab dashboard. A real deployment
// would use a proper login flow (Keycloak's hosted login page), not this.
let authToken = null;

async function getToken() {
  const res = await fetch(`${KEYCLOAK_URL}/realms/sentinelot/protocol/openid-connect/token`, {
    method: "POST",
    headers: {"Content-Type": "application/x-www-form-urlencoded"},
    body: "client_id=sentinelot-dashboard&grant_type=password&username=operator&password=operator123",
  });
  const data = await res.json();
  authToken = data.access_token;
}

function fmtTime(iso) {
  return new Date(iso).toLocaleString();
}

async function loadAlerts() {
  const res = await fetch(`${API_BASE}/v1/sites/${SITE_ID}/alerts`, {headers: {"Authorization": `Bearer ${authToken}`}});
  const data = await res.json();
  const body = document.getElementById("alerts-body");
  const empty = document.getElementById("alerts-empty");
  body.innerHTML = "";
  if (data.alerts.length === 0) {
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";
  for (const a of data.alerts) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${fmtTime(a.time)}</td>
      <td><span class="severity severity-${a.severity}">${a.severity}</span></td>
      <td>${a.description}</td>
      <td>${a.llm_explanation ?? "<em>pending...</em>"}</td>
      <td>${a.status}</td>
    `;
    body.appendChild(tr);
  }
}

async function loadAssets() {
  const res = await fetch(`${API_BASE}/v1/sites/${SITE_ID}/assets`, {headers: {"Authorization": `Bearer ${authToken}`}});
  const data = await res.json();
  const body = document.getElementById("assets-body");
  const empty = document.getElementById("assets-empty");
  body.innerHTML = "";
  if (data.assets.length === 0) {
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";
  for (const a of data.assets) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${a.ip_address ?? "-"}</td>
      <td>${a.device_role}</td>
      <td>${a.criticality}</td>
      <td>${fmtTime(a.first_seen)}</td>
      <td>${fmtTime(a.last_seen)}</td>
    `;
    body.appendChild(tr);
  }
}

async function refresh() {
  if (!authToken) { await getToken(); }
  document.getElementById("subtitle").textContent = "Pune Pilot Plant — last updated " + new Date().toLocaleTimeString();
  try {
    await Promise.all([loadAlerts(), loadAssets()]);
  } catch (e) {
    document.getElementById("subtitle").textContent = "Error reaching API: " + e.message;
  }
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
